    h('div', { class: 'note warn' }, 'Read-only commands (cat, grep, ls, df, ps, ip, journalctl…) run straight away; anything that could change the console is shown to you for approval first. Command output goes to the AI exactly as is — nothing in it is redacted.'),
    h('div', { class: 'grid2' },
      field('SSH username', sshUser, 'UniFi OS consoles: root. Self-hosted controllers: a login on that server.'),
      field('SSH port', sshPort)),
    field('SSH password', sshPw.wrap, `UniFi OS: Console Settings → Advanced → SSH, set a password there. Stored in ${storeName()}, not in any file in this folder.`),
    h('div', { class: 'actions', style: 'justify-content:flex-start;margin:-6px 0 12px' }, h('button', { class: 'btn', onclick: runSshTest }, 'Test SSH')),
    sshOut);
  function setSsh(on) {
    sshOn = on; sshTested = null;
    sshBtns.on.className = on ? 'on' : ''; sshBtns.off.className = on ? '' : 'on';
    sshFields.hidden = !on;
  }
  setSsh(sshOn);
  [host, sshPort, sshUser, sshPw.input].forEach(i => i.addEventListener('input', () => { sshTested = null; }));

  const values = () => ({ id: existing && existing.id, name: name.value.trim() || host.value.trim(), host: host.value.trim(),
    port: Number(port.value) || 443, site: (siteWrap.querySelector('select') || siteInput).value.trim() || 'default',
    auth, username: auth === 'password' ? user.value.trim() : undefined, secret: secret.input.value,
    ssh_enabled: sshOn, ssh_port: Number(sshPort.value) || 22, ssh_username: sshUser.value.trim() || 'root', ssh_secret: sshPw.input.value });

  async function runSshTest() {
    const { secret: _unused, ...v } = values();           // the UniFi password isn't needed for this
    if (!v.host) { sshOut.replaceChildren(result('bad', 'Enter the console’s address first.')); return null; }
    sshOut.replaceChildren(result('warn', `Connecting to ${v.host}:${v.ssh_port} over SSH…`));
    let r;
    try { r = await api('POST', '/api/connections/ssh-test', v); } catch (e) { r = { ok: false, error: e.message }; }
    if (!r.ok) { sshTested = null; sshOut.replaceChildren(result('bad', r.error)); return r; }
    sshTested = r;
    sshOut.replaceChildren(result(r.hostkey_changed ? 'warn' : 'ok',
      h('div', {}, `✓ SSH works${r.uname ? ' — ' + r.uname : ''}`),
      h('div', {}, 'Host key (saved so the app can tell if the console is ever swapped): ', h('code', {}, r.hostkey_display)),
      r.hostkey_changed ? h('div', { style: 'margin-top:6px' }, '⚠ This is a DIFFERENT host key from the one saved before. Only save if you know the console was reset or replaced.') : null));
    return r;
  }
  // Saving with SSH on needs one successful SSH test when anything SSH-related changed.
  function needsSshTest() {
    const v = values();
    if (!v.ssh_enabled) return false;
    if (!existing || !existing.ssh_hostkey) return true;
    return v.host !== existing.host || v.ssh_port !== existing.ssh_port || v.ssh_username !== existing.ssh_username || !!v.ssh_secret;
  }

  async function runTest() {
    const v = values();
    if (!v.host) { out.replaceChildren(result('bad', 'Enter the console’s address first.')); return null; }
    out.replaceChildren(result('warn', `Connecting to ${v.host}:${v.port}…`));
    let r;
    try { r = await api('POST', '/api/connections/test', v); } catch (e) { r = { ok: false, error: e.message }; }
    if (!r.ok) { tested = null; out.replaceChildren(result('bad', r.error)); return r; }
    tested = r;
    if (r.sites.length > 1 || !r.site_found) {
      const cur = v.site;
      const sel = h('select', {}, ...r.sites.map(s => h('option', { value: s.name, selected: s.name === cur }, `${s.desc} (${s.name})`)));
      if (!r.site_found && r.sites[0]) sel.value = r.sites[0].name;
      siteWrap.replaceChildren(sel);
    }
    out.replaceChildren(result(r.cert_changed ? 'warn' : 'ok',
      h('div', {}, `✓ Logged in to a ${r.console_label}. ${r.sites.length} site${r.sites.length === 1 ? '' : 's'} found` +
        (r.site_found ? '.' : ` — "${v.site}" wasn’t one of them, so pick a site above.`)),
      h('div', {}, 'Certificate fingerprint (saved so the app can tell if the console is ever swapped): ', h('code', {}, r.fingerprint_display)),
      r.cert_changed ? h('div', { style: 'margin-top:6px' }, '⚠ This is a DIFFERENT certificate from the one saved before. Only save if you know the console was reset or replaced.') : null));
    return r;
  }

  // Does saving need a fresh sign-in test? Only when something that affects sign-in changed.
  function needsTest() {
    if (!existing || !existing.fingerprint) return true;
    const v = values();
    return v.host !== existing.host || v.port !== existing.port || v.auth !== existing.auth ||
           (v.auth === 'password' && v.username !== existing.username) || !!v.secret;
  }

  let busy = false;
  async function save(activateIt) {
    if (busy) return;                          // one click = at most one sign-in attempt
    busy = true;
    const buttons = [...$('modal').querySelectorAll('.actions button')];
    const labels = buttons.map(b => b.textContent);
    buttons.forEach(b => b.disabled = true);
    const primary = buttons[buttons.length - 1];
    try {
      let r = tested;
      if (needsTest() && !r) {
        primary.textContent = 'Signing in…';
        r = await runTest();
        // Failed sign-in: stay here, save nothing, and don't retry automatically.
        if (!r || !r.ok) return;
        if (!r.site_found && r.sites.length > 1) {
          out.append(result('warn', 'Pick the right site above, then press the button again (it won’t sign in again).'));
          return;
        }
      }
      if (r && r.cert_changed && !confirm('The console presented a DIFFERENT certificate from the one saved before. Save and trust it?')) return;
      let s = sshTested;
      if (needsSshTest() && !s) {
        primary.textContent = 'Testing SSH…';
        s = await runSshTest();
        if (!s || !s.ok) return;
      }
      if (s && s.hostkey_changed && !confirm('The console presented a DIFFERENT SSH host key from the one saved before. Save and trust it?')) return;
      const v = values();
      if (r && r.ok) { v.console_type = r.console_type; v.fingerprint = r.fingerprint; }
      if (s && s.ok && v.ssh_enabled) v.ssh_hostkey = s.hostkey;
      if (!v.secret) delete v.secret;
      if (!v.ssh_secret) delete v.ssh_secret;
      v.activate = !!activateIt;
      primary.textContent = 'Saving…';
      await api('POST', '/api/connections', v);
      toast(`Saved "${v.name}".`);
      if (activateIt || wizard) clearChatView();
      await refreshStatus(); await refreshNetwork();
      if (wizard) { closeModal(); addMessage('assistant', 'All set! Try one of the quick prompts below, or ask me anything about your network.', { noRecord: true }); }
      else openConnections();
    } catch (e) {
      out.replaceChildren(result('bad', e.message));
    } finally {
      busy = false;
      buttons.forEach((b, k) => { if (b.isConnected) { b.disabled = false; b.textContent = labels[k]; } });
    }
  }

  async function del() {
    if (!confirm(`Delete the connection "${p.name}"? Its saved password/API key is removed too.`)) return;
    try { await api('POST', '/api/connections/delete', { id: existing.id }); clearChatView(); await refreshStatus(); await refreshNetwork(); openConnections(); }
    catch (e) { toast(e.message, true); }
  }
  async function trust() {
    if (!confirm('Trust the certificate the console presents right now? Do this only if you know the console was reset, replaced or had its certificate changed.')) return;
    const r = await api('POST', '/api/connections/trust-cert', { id: existing.id }).catch(e => ({ ok: false, error: e.message }));
    if (r.ok) { toast('New certificate trusted.'); await refreshStatus(); await refreshNetwork(); openConnections(); }
    else out.replaceChildren(result('bad', r.error));
  }

  const certNote = existing && status && status.active && status.active.id === existing.id && status.error_kind === 'cert'
    ? h('div', { class: 'note warn' }, status.error, h('div', { style: 'margin-top:8px' }, h('button', { class: 'btn', onclick: trust }, 'Trust new certificate'))) : null;

  openModal(
    ...modalHead(wizard ? 'Welcome! Let’s get you set up' : (existing ? `Edit “${p.name}”` : 'Add a UniFi connection'),
      wizard ? null : 'Enter how this PC reaches the UniFi console. Saving signs in once to check the details; nothing is saved if that fails.', !wizard),
    wizard ? h('div', { class: 'steps' }, h('span', { class: 'on' }), h('span', { class: 'on' })) : null,
    wizard ? h('h3', { style: 'font-size:15px;margin-bottom:12px' }, 'Step 2 · Your UniFi console') : null,
    certNote,
    field('Name', name, 'Any label you like, so you can tell networks apart.'),
    h('div', { class: 'grid2' },
      field('Console address', host, 'The IP you type in the browser to open UniFi, e.g. 192.168.1.1'),
      field('Port', port, '443 = UDM / UCG / Cloud Key Gen2+. 8443 = self-hosted. 11443 = UniFi OS Server.')),
    field('Login method', h('div', { class: 'seg' }, authBtns.password, authBtns.apikey)),
    userField, secretField,
    field('Site', siteWrap, 'Leave as "default" unless the console manages several sites — the sign-in check lists them.'),
    field('SSH access', h('div', { class: 'seg' }, sshBtns.off, sshBtns.on),
      'Off by default. When on, flinchbot can also run commands on the console itself for what the API can’t show (system logs, processes, disk, config files).'),
    sshFields,
    out,
    h('div', { class: 'actions' },
      existing ? h('button', { class: 'btn danger left', onclick: del }, 'Delete') : null,
      wizard ? null : h('button', { class: 'btn', onclick: () => openConnections() }, 'Back'),
      // One button: signs in once to check, saves only if that works, otherwise stays here.
      h('button', { class: 'btn primary', onclick: () => save(!existing || existing.id === data.active) },
        wizard ? 'Sign in & finish' : existing ? 'Check & save' : 'Sign in, save & use')));
  (existing ? secret.input : host).focus();
}

// ── export ────────────────────────────────────────────────────────────────
function exportMeta() {
  const a = status && status.active;
  return {
    network: a ? `${a.name} (${a.host}:${a.port}, site ${a.site})` : 'none',
    model: ((status && status.model) || '') + (status && status.provider_label ? ` (${status.provider_label})` : ''),
    exported: new Date(),
  };
}
const fmtTime = d => d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
function exportFileName(ext) {
  const a = status && status.active;
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
  const net = (a ? a.name : 'chat').replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '') || 'chat';
  return `unifi-flinchbot_${net}_${stamp}.${ext}`;
}
function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast(`Saved ${name} to your Downloads folder.`);
}
const LABEL = { user: '👤 You', assistant: '🤖 flinchbot', error: '⚠️ Error', approval: '🛡️ Change request', note: '■ Stopped' };
const labelFor = t => t.kind !== 'assistant' ? LABEL[t.kind]
  : t.second && t.by ? `🤖 ${BOT_NAME} · second opinion from ${t.by.label} (${t.by.model})`
  : t.by ? `🤖 ${BOT_NAME} · ${t.by.label} (${t.by.model})` : `🤖 ${BOT_NAME}`;

function toMarkdown() {
  const m = exportMeta();
  const out = [`# UniFi × flinchbot — chat export`, '',
    `- **Network:** ${m.network}`, `- **Model:** ${m.model}`, `- **Exported:** ${fmtTime(m.exported)}`, '', '---', ''];
  for (const t of transcript) {
    out.push(`### ${labelFor(t)} · ${fmtTime(t.at)}`, '');
    if (t.kind === 'approval') {
      for (const it of t.items) {
        out.push(`- **${it.label}**${it.target ? ` — \`${it.target}\`` : ''}`);
        const extra = Object.fromEntries(Object.entries(it.details || {}).filter(([k]) => k !== 'mac'));
        if (Object.keys(extra).length) out.push('', '  ```json', ...JSON.stringify(extra, null, 2).split('\n').map(l => '  ' + l), '  ```');
      }
      out.push('', `**Decision:** ${t.decision}`);
    } else if (t.kind === 'user') {
      out.push(...t.text.split('\n').map(l => '> ' + l));
    } else {
      out.push(t.text);
    }
    out.push('');
  }
  return out.join('\n');
}

function toHtml() {
  const m = exportMeta();
  const rows = transcript.map(t => {
    let body;
    if (t.kind === 'approval') {
      body = t.items.map(it => {
        const extra = Object.fromEntries(Object.entries(it.details || {}).filter(([k]) => k !== 'mac'));
        return `<div class="act"><b>${esc(it.label)}</b>${it.target ? ` <code>${esc(it.target)}</code>` : ''}` +
               (Object.keys(extra).length ? `<pre>${esc(JSON.stringify(extra, null, 2))}</pre>` : '') + '</div>';
      }).join('') + `<p class="dec ${t.decision === 'Approved' ? 'ok' : 'no'}">Decision: ${esc(t.decision)}</p>`;
    } else if (t.kind === 'assistant') {
      body = formatMarkdown(t.text);               // escapes first, then adds formatting
    } else {
      body = esc(t.text).replace(/\n/g, '<br>');
      if (t.images && t.images.length) body += `<div class="imgs">${t.images.map(i => `<img src="${i.src}" alt="${esc(i.name)}" title="${esc(i.name)}">`).join('')}</div>`;
    }
    return `<section class="m ${t.kind}"><header>${esc(labelFor(t))}<time>${esc(fmtTime(t.at))}</time></header><div>${body}</div></section>`;
  }).join('\n');
  return `<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UniFi × flinchbot — ${esc(m.network)} — ${esc(fmtTime(m.exported))}</title>
<style>
  :root{--bg:#fff;--fg:#1a1d24;--muted:#667085;--line:#e4e7ec;--you:#eef8fb;--ai:#f8f9fb;--warn:#fff4ed;--accent:#0b7fa5;--ok:#067647;--no:#b42318}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1016;--fg:#e2e8f0;--muted:#8b95a7;--line:#252a36;--you:#0f2530;--ai:#141821;--warn:#2a1a12;--accent:#3cc8f0;--ok:#4ade80;--no:#f87171}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:860px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:22px;margin:0 0 6px} .meta{color:var(--muted);font-size:13px;margin-bottom:24px} .meta b{color:var(--fg)}
  section.m{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0;background:var(--ai);break-inside:avoid}
  section.user{background:var(--you);margin-left:12%} section.approval{background:var(--warn)} section.error{border-color:var(--no)}
  section header{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  section h3{font-size:14px;margin:10px 0 4px;color:var(--accent)} section ul,section ol{padding-left:20px;margin:6px 0}
  code{font:12px ui-monospace,Consolas,monospace;background:rgba(127,127,127,.12);padding:1px 5px;border-radius:4px}
  pre{font:12px ui-monospace,Consolas,monospace;background:rgba(127,127,127,.1);padding:10px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}
  .act{margin:4px 0} .dec{font-weight:600;margin:8px 0 0} .dec.ok{color:var(--ok)} .dec.no{color:var(--no)}
  .imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px} .imgs img{max-width:100%;max-height:360px;border-radius:8px;border:1px solid var(--line)}
  @media print{section.user{margin-left:0} body{font-size:12px}}
</style></head>
<body><main>
<h1>UniFi × flinchbot — chat export</h1>
<div class="meta"><b>Network:</b> ${esc(m.network)} &nbsp;·&nbsp; <b>Model:</b> ${esc(m.model)} &nbsp;·&nbsp; <b>Exported:</b> ${esc(fmtTime(m.exported))}</div>
${rows}
</main></body></html>`;
}

function exportChat(kind) {
  $('exportMenu').hidden = true;
  if (!transcript.length) { toast('Nothing to export yet — ask something first.', true); return; }
  if (kind === 'md') download(exportFileName('md'), toMarkdown(), 'text/markdown;charset=utf-8');
  else download(exportFileName('html'), toHtml(), 'text/html;charset=utf-8');
}

// ── action report ─────────────────────────────────────────────────────────
const PRI = ['critical', 'high', 'medium', 'low'];
const PRI_LABEL = { critical: '🔴 Critical', high: '🟠 High', medium: '🟡 Medium', low: '🔵 Low' };
// The latest report of each connection is saved by the app and reopened as it is;
// only ↻ Refresh report asks the AI again.
async function openReport() {
  if (!status || !status.configured) { openSettings(); return; }
  if (!status.active) { openConnections(null, true); return; }
  let r = null;
  try { r = (await api('GET', '/api/report')).report; } catch (e) { toast(e.message, true); return; }
  if (r) showReport(r); else runReport();
}

async function runReport() {
  if (!status || !status.configured) { openSettings(); return; }
  if (!status.active) { openConnections(null, true); return; }
  if (aiOffline()) { offlineToast(); return; }
  const started = Date.now();
  const timer = h('span', {}, '0s');
  const tick = setInterval(() => timer.textContent = Math.round((Date.now() - started) / 1000) + 's', 1000);
  openModal(...modalHead('Building your action report', null, false),
    h('div', { style: 'display:flex;gap:14px;align-items:center;margin:8px 0 6px' }, h('div', { class: 'spinner' }),
      h('div', {}, h('div', {}, `${aiName()} is reviewing “${status.active.name}” — devices, clients, Wi-Fi, firewall, logs…`),
        h('div', { class: 'muted' }, 'Read-only: nothing on the network is changed. Usually 1–3 minutes. Elapsed: ', timer))));
  try {
    const r = await api('POST', '/api/report', {});
    clearInterval(tick);
    showReport(r);
    const c = countBy(r.items);
    addMessage('assistant', `**Action report ready** for ${r.network}: ` +
      PRI.filter(p => c[p]).map(p => `${c[p]} ${p}`).join(', ') + (r.items.length ? '.' : ' — no issues found.') +
      '\n\nOpen 📋 Action report to see it again, ask about an item (💬 Ask), or download it as a checklist.', { noRecord: false });
  } catch (e) {
    clearInterval(tick);
    openModal(...modalHead('Report failed'), result('bad', e.message),
      h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: closeModal }, 'Close'), h('button', { class: 'btn primary', onclick: runReport }, 'Try again')));
  }
}

function countBy(items) { const c = {}; for (const i of items) c[i.priority] = (c[i.priority] || 0) + 1; return c; }

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 2) return 'just now';
  if (m < 90) return `${m} minutes ago`;
  if (m < 36 * 60) return `${Math.round(m / 60)} hours ago`;
  return `${Math.round(m / 1440)} days ago`;
}

function askAboutItem(r, it) {
  if (busy) { toast(`${aiName()} is still answering. Ask again when it has finished.`, true); return; }
  const text = [
    `From the action report for ${r.network} (made ${new Date(r.generated_at).toLocaleString()}), tell me more about this ${it.priority}-priority item:`,
    `${it.title} (${it.category})`,
    it.affected.length ? `Affected: ${it.affected.join(', ')}` : null,
    `Finding: ${it.finding}`,
    `Why it matters: ${it.why}`,
    it.steps.length ? `Suggested fix: ${it.steps.join(' → ')}` : null,
    'Check the live data to see whether it is still the case, explain what is going on in plain terms, and walk me through fixing it.',
  ].filter(Boolean).join('\n');
  askFlinchbot(`💬 Tell me more about: ${it.title}`, text);
}

function showReport(r) {
  const c = countBy(r.items);
  openModal(...modalHead('Network action report', `${r.network} · ${r.model}`),
    h('div', { class: 'rep-bar' },
      h('span', { class: 'muted' }, `Made ${new Date(r.generated_at).toLocaleString()} (${ago(r.generated_at)}). Saved until you refresh it.`),
      h('button', { class: 'btn', title: `Review the network again with ${aiName()} (takes 1–3 minutes and uses AI tokens)`, onclick: runReport }, '↻ Refresh report')),
    h('p', { style: 'font-size:13px;line-height:1.6' }, r.summary),
    h('div', { class: 'counts' }, ...PRI.map(p => h('span', { class: `badge ${p}` }, `${c[p] || 0} ${p}`))),
    h('div', { style: 'max-height:46vh;overflow:auto;margin:10px 0' },
      r.items.length ? r.items.map(it => h('div', { class: 'rep-item' },
        h('div', { class: 't' }, h('span', { class: `badge ${it.priority}` }, it.priority), h('span', { class: 'title' }, it.title),
          h('button', { class: 'btn rep-ask', title: `Chat with ${aiName()} about this`, onclick: () => askAboutItem(r, it) }, '💬 Ask')),
        h('div', { class: 's' }, [it.category, it.affected.length ? it.affected.slice(0, 3).join(', ') + (it.affected.length > 3 ? ` +${it.affected.length - 3} more` : '') : null].filter(Boolean).join(' · '))))
        : h('div', { class: 'muted' }, 'No issues found.')),
    h('div', { class: 'note' }, 'Download it to tick items off as you fix them. The web page remembers your ticks; the Markdown file uses standard [ ] checkboxes.'),
    h('div', { class: 'actions' },
      h('button', { class: 'btn', onclick: () => download(reportFileName(r, 'md'), reportMarkdown(r), 'text/markdown;charset=utf-8') }, '⤓ Markdown'),
      h('button', { class: 'btn primary', onclick: () => download(reportFileName(r, 'html'), reportHtml(r), 'text/html;charset=utf-8') }, '⤓ Checklist web page')));
}

function reportFileName(r, ext) {
  const d = new Date(r.generated_at), pad = n => String(n).padStart(2, '0');
  const net = r.network.replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '') || 'network';
  return `unifi-action-report_${net}_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`;
}

function reportMarkdown(r) {
  const c = countBy(r.items);
  // one line per field; neutralise HTML, which some Markdown viewers (e.g. Obsidian) would render
  const md = s => String(s).replace(/\r?\n/g, ' ').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const out = [`# Network action report — ${r.network}`, '',
    `- **Generated:** ${new Date(r.generated_at).toLocaleString()}`,
    `- **Console:** ${r.host} · site ${r.site}`, `- **Reviewed by:** ${r.model}`,
    `- **Open items:** ` + PRI.map(p => `${c[p] || 0} ${p}`).join(' · '), '',
    '## Summary', '', r.summary, ''];
  for (const p of PRI) {
    const items = r.items.filter(i => i.priority === p);
    if (!items.length) continue;
    out.push(`## ${PRI_LABEL[p]} (${items.length})`, '');
    for (const it of items) {
      out.push(`- [ ] **${md(it.title)}** — _${md(it.category)}_${it.effort ? ` · effort: ${it.effort}` : ''}`);
      if (it.affected.length) out.push(`  - **Affected:** ${it.affected.map(a => '`' + md(a).replace(/`/g, "'") + '`').join(', ')}`);
      out.push(`  - **Finding:** ${md(it.finding)}`, `  - **Why it matters:** ${md(it.why)}`);
      if (it.steps.length) { out.push('  - **How to fix:**'); it.steps.forEach((st, i) => out.push(`    ${i + 1}. ${md(st)}`)); }
      out.push('');
    }
  }
  if (r.healthy && r.healthy.length) { out.push('## ✅ Looks good', '', ...r.healthy.map(x => `- ${md(x)}`), ''); }
  out.push('---', '_Generated by UniFi × flinchbot from live, read-only data. Verify before making changes._', '');
  return out.join('\n');
}

// ── topology (vector map: UniFi devices + only the clients with issues) ───
async function openTopology() {
  if (!status || !status.active) { openConnections(null, true); return; }
  openModal(...modalHead('Network topology', null, false),
    h('div', { style: 'display:flex;gap:14px;align-items:center;margin:8px 0 6px' }, h('div', { class: 'spinner' }),
      h('div', {}, `Reading devices, clients and the last 24 h of the system log from “${status.active.name}”…`)));
  let r;
  try { r = await api('GET', '/api/topology'); }
  catch (e) {
    openModal(...modalHead('Topology failed'), result('bad', e.message),
      h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: closeModal }, 'Close'), h('button', { class: 'btn primary', onclick: openTopology }, 'Try again')));
    return;
  }
  const svg = importSvg(r.svg);
  const view = h('div', { class: 'topo-view' }, svg);
  let scale = 1, tx = 0, ty = 0;
  const applyT = () => { svg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
  const fit = () => {
    const vw = view.clientWidth, vh = view.clientHeight;
    const sw = Number(svg.getAttribute('width')), sh = Number(svg.getAttribute('height'));
    scale = Math.min(1, vw / sw, vh / sh); tx = Math.max(0, (vw - sw * scale) / 2); ty = 0; applyT();
  };
  const zoom = (f, cx, cy) => {
    const s = Math.min(6, Math.max(0.15, scale * f));
    if (cx === undefined) { cx = view.clientWidth / 2; cy = view.clientHeight / 2; }
    tx = cx - (cx - tx) * (s / scale); ty = cy - (cy - ty) * (s / scale); scale = s; applyT();
  };
  view.addEventListener('wheel', e => { e.preventDefault(); const b = view.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - b.left, e.clientY - b.top); }, { passive: false });
  let drag = null;
  view.addEventListener('pointerdown', e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; view.classList.add('dragging'); view.setPointerCapture(e.pointerId); });
  view.addEventListener('pointermove', e => { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; applyT(); } });
  view.addEventListener('pointerup', () => { drag = null; view.classList.remove('dragging'); });
  view.addEventListener('pointercancel', () => { drag = null; view.classList.remove('dragging'); });
  const t = r.totals;
  const sub = `${r.network} · ${new Date(r.generated_at).toLocaleString()} · ${t.devices} UniFi devices · ${t.clients} clients · ${t.problem_clients} with issues`;
  openModal(...modalHead('Network topology', sub), view,
    h('div', { class: 'topo-bar' },
      h('span', { class: 'muted' }, 'Scroll to zoom, drag to pan. Hover a box for details. Only clients with a problem are drawn; the SVG is vector, so zoom in as far as you like.'),
      h('button', { class: 'btn', onclick: () => zoom(1 / 1.3), title: 'Zoom out' }, '−'),
      h('button', { class: 'btn', onclick: () => zoom(1.3), title: 'Zoom in' }, '+'),
      h('button', { class: 'btn', onclick: fit }, 'Fit'),
      h('button', { class: 'btn', onclick: openTopology }, '↻ Refresh'),
      h('button', { class: 'btn primary', onclick: () => download(topoFileName(r), r.svg, 'image/svg+xml;charset=utf-8') }, '⤓ Download SVG'),
      h('button', { class: 'btn', onclick: closeModal }, 'Close')));
  $('modal').classList.add('wide');
  fit();
}
function topoFileName(r) {
  const d = new Date(r.generated_at), pad = n => String(n).padStart(2, '0');
  const net = r.network.replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '') || 'network';
  return `unifi-topology_${net}_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.svg`;
}

// The server builds and escapes these SVGs itself; parse as a document rather than injecting markup.
function importSvg(text) {
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  return document.importNode(doc.documentElement, true);
}
const stamp = d => { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; };

// ── undo + change log ───────────────────────────────────────────────────────
async function undoChange(id, label, describe, btn) {
  if (!confirm(`Undo “${label}”?\n\n${describe || ''}`)) return false;
  if (btn) btn.disabled = true;
  try {
    let r = await api('POST', '/api/changes/undo', { id });
    if (r.conflict) {
      if (!confirm(`${r.detail}\n\nUndo anyway?`)) { if (btn) btn.disabled = false; return false; }
      r = await api('POST', '/api/changes/undo', { id, force: true });
    }
    toast(r.detail || 'Undone.');
    addMessage('assistant', `↶ Undone: ${label}. ${r.detail || ''}`, { plain: true });
    if (btn) btn.replaceWith(h('span', { class: 'muted', style: 'margin-left:8px' }, '↶ Undone.'));
    refreshNetwork();
    return true;
  } catch (e) { toast(e.message, true); if (btn) btn.disabled = false; return false; }
}

const CHANGE_FIELDS = ['at', 'connection', 'host', 'site', 'user', 'pc', 'via', 'decision', 'ok', 'label', 'target', 'tool', 'input', 'result', 'note', 'undoes', 'undone_by'];
function changesCsv(rows) {
  // Quote every cell; prefix cells a spreadsheet would treat as a formula (names come from the network).
  const cell = v => { let s = v === undefined || v === null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  return [CHANGE_FIELDS.join(','), ...rows.map(r => CHANGE_FIELDS.map(f => cell(r[f])).join(','))].join('\r\n') + '\r\n';
}

// ── pan/zoom viewer for a server-made SVG ──────────────────────────────────
function svgViewer(svgText, cls = 'topo-view') {
  const svg = importSvg(svgText);
  const view = h('div', { class: cls }, svg);
  let scale = 1, tx = 0, ty = 0, drag = null;
  const apply = () => { svg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
  const fit = () => {
    const vw = view.clientWidth, vh = view.clientHeight, sw = Number(svg.getAttribute('width')), sh = Number(svg.getAttribute('height'));
    scale = Math.min(1, vw / sw, vh / sh); tx = Math.max(0, (vw - sw * scale) / 2); ty = 0; apply();
  };
  const zoom = (f, cx, cy) => {
    const s = Math.min(6, Math.max(0.15, scale * f));
    if (cx === undefined) { cx = view.clientWidth / 2; cy = view.clientHeight / 2; }
    tx = cx - (cx - tx) * (s / scale); ty = cy - (cy - ty) * (s / scale); scale = s; apply();
  };
  view.addEventListener('wheel', e => { e.preventDefault(); const b = view.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - b.left, e.clientY - b.top); }, { passive: false });
  view.addEventListener('pointerdown', e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; view.classList.add('dragging'); view.setPointerCapture(e.pointerId); });
  view.addEventListener('pointermove', e => { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); } });
  view.addEventListener('pointerup', () => { drag = null; view.classList.remove('dragging'); });
  view.addEventListener('pointercancel', () => { drag = null; view.classList.remove('dragging'); });
  return { view, fit, zoom };
}

    u.token_saved ? h('div', {}, 'A GitHub token is saved in ', storeName(), '. ',

      : h('div', {}, `Paste a GitHub token that can read ${u.repo}. It is kept in ${storeName()} and only sent to GitHub. `,
          h('a', { href: '/setup#updates', target: '_blank', rel: 'noopener' }, 'How to make one')),
    h('div', { class: 'field', style: 'display:flex;gap:8px;align-items:center;margin:8px 0 0' },
      h('div', { style: 'flex:1' }, tok.wrap), saveTok)) : null;

  const auto = h('input', { type: 'checkbox', checked: u.auto || null });
  auto.addEventListener('change', () => api('POST', '/api/update/settings', { auto: auto.checked }).then(() => toast(auto.checked ? 'Daily check on.' : 'Daily check off.'), e => toast(e.message, true)));
  const install = u.newer && !u.git_checkout ? needsNet(h('button', { class: 'btn primary' }, `Install v${u.latest} and restart`)) : null;
  if (install) install.addEventListener('click', () => installUpdate(u));
  const backups = u.backups.length && !u.git_checkout ? h('div', { style: 'margin:10px 0' },

  openModal(...modalHead('Updates', `This app updates itself from GitHub (${u.repo}). Your settings, connections, passwords and the data folder are never touched.`),

async function installUpdate(u) {
  if (!confirm(`Install version ${u.latest}?\n\nThe app’s files are replaced with the new version’s. Your settings, connections, passwords and the data folder are not touched, and the replaced files are kept so you can roll back.\n\nThe app then restarts and this page reconnects by itself.`)) return;
  busyModal('Updating', `Downloading version ${u.latest} from GitHub and installing it…`);
  let r;
  try { r = await api('POST', '/api/update/install', {}); }
  catch (e) { failModal('The update didn’t install', e, () => openUpdates(true)); return; }
  waitForRestart(r.version, r.restart, `Version ${r.version} installed.`);
}

async function rollbackUpdate(b) {
  if (!confirm(`Put back version ${b.version}? The files the update replaced are restored, and the app restarts.`)) return;
  busyModal('Rolling back', `Putting back version ${b.version}…`);
  let r;
  try { r = await api('POST', '/api/update/rollback', { name: b.name }); }
  catch (e) { failModal('Roll back failed', e, () => openUpdates()); return; }
  waitForRestart(r.version, r.restart, `Version ${r.version} put back.`);
}

async function waitForRestart(version, restart, done) {
  if (!restart) {
    openModal(...modalHead('Restart the app'), result('ok', done),
      h('p', {}, `Close the app’s window and start it again with ${launcherName()} to run it.`),
      h('div', { class: 'actions' }, h('button', { class: 'btn primary', onclick: closeModal }, 'OK')));
    return;
  }
  busyModal('Restarting', `${done} The app is restarting; if the new version needs new packages, that takes a minute.`);
  const t0 = Date.now();
  while (Date.now() - t0 < 240000) {
    await new Promise(res => setTimeout(res, 1500));
    try {
      const r = await fetch('/api/status', { headers: { 'X-App-Token': TOKEN } });
      if (r.status === 401) { location.reload(); return; }             // new page token: reload picks it up
      if (r.ok && (await r.json()).version === version) { location.reload(); return; }
    } catch {}                                                           // down while it restarts
  }
  failModal('Still restarting', new Error(`The app hasn’t come back after 4 minutes. Look at its window for a message. If the new version won’t start, see “If an update goes wrong” in the setup guide.`));
}

$('themeBtn').addEventListener('click', openThemes);
$('reportBtn').addEventListener('click', openReport);
$('topoBtn').addEventListener('click', openTopology);
$('wanBtn').addEventListener('click', () => openWan());
$('changesBtn').addEventListener('click', () => openChanges());
$('backupBtn').addEventListener('click', runBackup);
$('usageChip').addEventListener('click', openUsage);
$('updateBtn').addEventListener('click', () => openUpdates());
$('toolsBtn').addEventListener('click', e => { e.stopPropagation(); $('toolsMenu').hidden = !$('toolsMenu').hidden; });
document.addEventListener('click', e => { if (!e.target.closest('#toolsMenu') && e.target.id !== 'toolsBtn') $('toolsMenu').hidden = true; });
$('toolsMenu').addEventListener('click', e => {
  const b = e.target.closest('[data-tool]'); if (!b) return;
  $('toolsMenu').hidden = true;
  ({ ports: openPortMap, detective: openDetective, scorecard: openScorecard, handbook: openHandbook,
     resetkit: openResetKit, usage: openUsage, updates: () => openUpdates(true) })[b.dataset.tool]();
});

$('exportBtn').addEventListener('click', e => { e.stopPropagation(); $('exportMenu').hidden = !$('exportMenu').hidden; });
$('exportMd').addEventListener('click', () => exportChat('md'));
$('exportHtml').addEventListener('click', () => exportChat('html'));
document.addEventListener('click', e => { if (!e.target.closest('#exportMenu') && e.target.id !== 'exportBtn') $('exportMenu').hidden = true; });

async function init() {
  const s = await refreshStatus();
  if (!s) return;
  if (!s.configured) openSettings(true);
  else if (!s.has_connections) openConnections(null, true, true);
  refreshUsage();
  checkUpdates();
  await refreshNetwork();
  if (s.pending && s.pending.length) addApproval(s.pending);
}
init();
setInterval(() => { if (!document.hidden) refreshStatus(); }, 30000);
setInterval(() => { if (!document.hidden && status && status.connected) refreshNetwork(); }, 60000);
setInterval(checkUpdates, 6 * 3600 * 1000);
</script>
</body>
</html>
