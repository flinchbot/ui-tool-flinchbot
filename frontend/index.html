<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="app-token" content="__APP_TOKEN__">
<title>UniFi × flinchbot</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<script src="/static/themes.js?v=__APP_VERSION__"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Theme tokens. Defaults = the original dark look; static/themes.css overrides them
     per [data-theme][data-mode] (colours, fonts, type scale, shapes, layout). */
  :root {
    --bg:#0a0c10; --surface:#111318; --surface2:#161922; --border:#1e2230;
    --accent:#00d4ff; --accent2:#7b61ff; --warn:#ff6b35; --ok:#00e5a0; --danger:#ff4d6d; --medium:#ffc800;
    --text:#e2e8f0; --muted:#64748b; --bot:#ff6b81; --on-accent:#fff;
    --grad:linear-gradient(135deg,var(--accent),var(--accent2));
    --chat-bg:var(--bg); --overlay:rgba(3,5,8,.72); --shadow:0 24px 60px rgba(0,0,0,.6);
    --radius:8px; --radius-lg:14px; --bubble-radius:12px; --pill:99px;
    --font-ui:'Syne',system-ui,sans-serif; --font-mono:'Space Mono',ui-monospace,monospace; --font-head:var(--font-ui);
    --fs:16px; --sidebar-w:300px; --chat-max:860px;
  }
  html { font-size:var(--fs); }
  h1,h2,h3,h4 { font-family:var(--font-head); }
  #fx { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .app { position:relative; z-index:1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--font-ui); }
  button { font-family:inherit; }
  .app { display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto 1fr; grid-template-areas:'header' 'banner' 'main'; height:100vh; overflow:hidden; }
  .app > header { grid-area:header; } .app > .banner { grid-area:banner; } .app > main { grid-area:main; }

  /* header */
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--border);
           background:var(--surface); position:relative; }
  .logo { display:flex; align-items:center; gap:12px; }
  .logo-btn { display:flex; align-items:center; gap:12px; background:none; border:0; color:inherit; cursor:pointer; padding:0; text-align:left; }
  .logo-img { width:36px; height:36px; border-radius:8px; display:block; box-shadow:0 0 0 1px color-mix(in srgb,var(--text) 10%,transparent); transition:transform .2s; }
  .logo-btn:hover .logo-img { transform:rotate(-6deg) scale(1.06); }
  .about-art { display:block; width:min(360px,100%); margin:4px auto 0; border-radius:6px; box-shadow:0 10px 30px rgba(0,0,0,.45); }
  .about-caption { text-align:center; font-family:var(--font-mono); font-size:0.9375rem; letter-spacing:3px; margin:12px 0 2px; color:var(--bot); }
  .about-meta { text-align:center; font-size:0.75rem; color:var(--muted); line-height:1.7; }
  .logo-icon { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
               background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .logo h1 { font-size:1.125rem; font-weight:800; letter-spacing:-.3px; white-space:nowrap; }
  .logo span { color:var(--accent); }
  .spacer { flex:1; }

  .conn-switch { position:relative; }
  .conn-btn { display:flex; align-items:center; gap:8px; padding:7px 14px; border-radius:99px; cursor:pointer;
              background:color-mix(in srgb,var(--ok) 8%,transparent); border:1px solid color-mix(in srgb,var(--ok) 25%,transparent); color:var(--ok);
              font-family:var(--font-mono); font-size:0.75rem; max-width:340px; }
  .conn-btn.offline { background:color-mix(in srgb,var(--warn) 8%,transparent); border-color:color-mix(in srgb,var(--warn) 30%,transparent); color:var(--warn); }
  .conn-btn.none { background:transparent; border-color:var(--border); color:var(--muted); }
  .conn-btn .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .menu { position:absolute; top:calc(100% + 6px); left:0; min-width:280px; background:var(--surface2);
          border:1px solid var(--border); border-radius:var(--radius); padding:6px; z-index:20; box-shadow:var(--shadow); }
  .menu[hidden] { display:none; }
  .menu-item { display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border:0; border-radius:6px;
               background:transparent; color:var(--text); font-size:0.8125rem; text-align:left; cursor:pointer; }
  .menu-item:hover { background:var(--border); }
  .menu-item small { color:var(--muted); font-family:var(--font-mono); font-size:0.625rem; display:block; }
  .menu-item .check { width:14px; color:var(--accent); }
  .menu hr { border:0; border-top:1px solid var(--border); margin:6px 0; }

  .header-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; min-width:0; }
  .btn { padding:7px 14px; border-radius:var(--radius); border:1px solid var(--border); background:transparent; color:var(--muted);
         font-size:0.8125rem; cursor:pointer; transition:all .2s; white-space:nowrap; }
  .btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.primary { background:var(--grad); border:0; color:var(--on-accent); font-weight:600; }
  .btn.primary:hover:not(:disabled) { opacity:.88; color:var(--on-accent); }
  .btn.danger { border-color:color-mix(in srgb,var(--danger) 40%,transparent); color:var(--danger); }
  .btn.danger:hover:not(:disabled) { border-color:var(--danger); color:var(--danger); background:color-mix(in srgb,var(--danger) 8%,transparent); }
  .btn.ok { border-color:color-mix(in srgb,var(--ok) 40%,transparent); color:var(--ok); }

  /* banner */
  .banner { display:flex; align-items:center; gap:12px; padding:10px 24px; font-size:0.8125rem;
            background:color-mix(in srgb,var(--warn) 12%,transparent); border-bottom:1px solid color-mix(in srgb,var(--warn) 30%,transparent); color:color-mix(in srgb,var(--warn) 30%,var(--text)); }
  .banner[hidden] { display:none; }
  .banner .msg { flex:1; }

  /* layout */
  main { display:grid; grid-template-columns:var(--sidebar-w) minmax(0,1fr); overflow:hidden; min-height:0; }
  aside { border-right:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; overflow-y:auto; min-height:0; }
  .sidebar-section { padding:16px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .sidebar-section.devices-section { flex:1; overflow-y:auto; min-height:0; }
  .sidebar-section h3 { font-size:0.625rem; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .stat-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .stat-card { min-width:0; overflow:hidden; }
  .stat-card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:12px; }
  .stat-val { font-size:1.5rem; font-weight:800; font-family:var(--font-mono); color:var(--accent); }
  .stat-val.warn { color:var(--warn); }
  .stat-label { font-size:0.6875rem; color:var(--muted); margin-top:2px; }
  .device-list { display:flex; flex-direction:column; gap:6px; }
  .device-item { display:flex; align-items:center; gap:10px; padding:10px; background:var(--bg); border:1px solid var(--border);
                 border-radius:var(--radius); cursor:pointer; transition:border-color .2s; text-align:left; color:inherit; width:100%; }
  .device-item:hover { border-color:var(--accent2); }
  .device-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--ok); }
  .device-dot.offline { background:var(--warn); }
  .device-info { flex:1; min-width:0; }
  .device-name { font-size:0.75rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .device-meta { font-size:0.625rem; color:var(--muted); font-family:var(--font-mono); }
  .device-clients { font-size:0.625rem; font-family:var(--font-mono); color:var(--accent2); background:color-mix(in srgb,var(--accent2) 12%,transparent); padding:2px 6px; border-radius:4px; }
  .muted { color:var(--muted); font-size:0.75rem; }
  .side-error { color:var(--warn); font-size:0.6875rem; margin-top:8px; }

  /* chat */
  .chat-area { display:flex; flex-direction:column; background:var(--chat-bg); min-height:0; overflow:hidden; }
  .chat-toolbar { padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px;
                  border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .chat-toolbar h2 { font-size:0.9375rem; font-weight:600; }
  .chat-toolbar .sub { font-size:0.6875rem; color:var(--muted); font-family:var(--font-mono); }
  .messages { flex:1; overflow-y:auto; padding:24px 20px; display:flex; flex-direction:column; gap:16px; min-height:0; }
  .messages::-webkit-scrollbar { width:4px; } .messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .msg { display:flex; gap:12px; max-width:var(--chat-max); animation:fadeUp .3s ease; flex-shrink:0; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .msg-avatar { width:32px; height:32px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.875rem; }
  .msg.assistant .msg-avatar { background:var(--grad); overflow:hidden; }
  .msg-avatar img { width:100%; height:100%; display:block; }
  .msg-body { display:flex; flex-direction:column; gap:3px; min-width:0; max-width:calc(100% - 44px); }
  .msg.user .msg-body { align-items:flex-end; }
  .msg-name { font-size:0.6875rem; font-weight:600; color:var(--muted); letter-spacing:.3px; padding:0 4px; }
  .msg.assistant .msg-name { color:var(--bot); }
  .msg.user .msg-avatar { background:var(--surface); border:1px solid var(--border); }
  .msg-bubble { padding:12px 16px; border-radius:var(--bubble-radius); font-size:0.875rem; line-height:1.65; max-width:100%; overflow-wrap:anywhere; }
  .msg.assistant .msg-bubble { background:var(--surface); border:1px solid var(--border); border-top-left-radius:2px; }
  .msg.user .msg-bubble { background:color-mix(in srgb,var(--accent) 9%,transparent); border:1px solid color-mix(in srgb,var(--accent) 22%,transparent); border-top-right-radius:2px; white-space:pre-wrap; }
  .msg.error .msg-bubble { border-color:color-mix(in srgb,var(--warn) 40%,transparent); color:color-mix(in srgb,var(--warn) 30%,var(--text)); }
  .msg-bubble pre { background:var(--bg); border:1px solid var(--border); padding:10px; border-radius:6px; overflow-x:auto;
                    font-family:var(--font-mono); font-size:0.75rem; margin:8px 0; white-space:pre-wrap; }
  .msg-bubble code { background:var(--bg); padding:1px 5px; border-radius:3px; font-family:var(--font-mono); font-size:0.75rem; }
  .msg-bubble strong { color:var(--accent); }
  .msg-bubble ul, .msg-bubble ol { padding-left:18px; margin:6px 0; }
  .msg-bubble li { margin:3px 0; }
  .msg-bubble h3 { font-size:0.8125rem; margin:10px 0 4px; color:var(--accent2); }

  .approval { border:1px solid color-mix(in srgb,var(--warn) 45%,transparent) !important; background:color-mix(in srgb,var(--warn) 7%,var(--surface)) !important; }
  .approval h4 { font-size:0.8125rem; color:var(--warn); margin-bottom:8px; }
  .action { border-top:1px solid var(--border); padding:8px 0; }
  .action:first-of-type { border-top:0; }
  .action .label { font-weight:600; font-size:0.8125rem; }
  .action .target { font-family:var(--font-mono); font-size:0.6875rem; color:var(--muted); }
  .approval .row { display:flex; gap:8px; margin-top:10px; }
  .decided { font-size:0.75rem; color:var(--muted); margin-top:8px; font-family:var(--font-mono); }

  .typing { display:flex; gap:6px; padding:4px 0; }
  .typing-dot { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:bounce 1.2s infinite; }
  .typing-dot:nth-child(2){animation-delay:.2s} .typing-dot:nth-child(3){animation-delay:.4s}
  @keyframes bounce { 0%,60%,100%{transform:none} 30%{transform:translateY(-6px)} }

  .chat-input-area { padding:16px 20px; border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .quick-prompts { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .quick-btn { padding:5px 12px; border-radius:var(--pill); font-size:0.6875rem; background:var(--bg); border:1px solid var(--border);
               color:var(--muted); cursor:pointer; }
  .quick-btn:hover { border-color:var(--accent2); color:var(--accent2); }
  .input-row { display:flex; gap:10px; }
  .attach-btn { width:44px; height:44px; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg);
                color:var(--muted); cursor:pointer; font-size:1.125rem; align-self:flex-end; flex:none; }
  .attach-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .attach-btn:disabled { opacity:.4; cursor:not-allowed; }
  .attachments { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .attachments:empty { display:none; }
  .att-chip { display:inline-flex; align-items:center; gap:6px; max-width:100%; padding:4px 6px 4px 10px; border-radius:var(--pill);
              border:1px solid var(--border); background:var(--surface2); font-size:0.75rem; color:var(--text); }
  .att-chip .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:260px; }
  .att-chip .sz { color:var(--muted); font-family:var(--font-mono); font-size:0.6875rem; }
  .att-chip button { background:none; border:0; color:var(--muted); cursor:pointer; font-size:0.875rem; padding:0 4px; }
  .att-chip button:hover { color:var(--danger); }
  .att-note { font-size:0.6875rem; color:var(--muted); width:100%; }
  .att-chip.img { padding-left:4px; }
  .att-chip img { width:28px; height:28px; object-fit:cover; border-radius:4px; background:var(--bg); }
  .msg-files { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; white-space:normal; }
  .msg-files .att-chip { padding-right:10px; }
  .msg-img { display:inline-block; line-height:0; }
  .msg-img img { max-height:180px; max-width:100%; border-radius:8px; border:1px solid var(--border); background:var(--bg); }
  .chat-input-area.drag { outline:2px dashed var(--accent); outline-offset:-6px; }
  .chat-input { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; color:var(--text);
                font-family:var(--font-ui); font-size:0.875rem; outline:none; resize:none; line-height:1.5; }
  .chat-input:focus { border-color:var(--accent); }
  .send-btn { width:44px; height:44px; border-radius:var(--radius); border:none; background:var(--grad);
              color:var(--on-accent); cursor:pointer; font-size:1.125rem; align-self:flex-end; }
  .send-btn:disabled { opacity:.4; cursor:not-allowed; }
  .send-btn.stop { background:var(--danger); color:#fff; font-size:0.9375rem; }
  .msg.user.stopped .msg-bubble { opacity:.5; text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--text) 35%,transparent); }
  .so-row { position:relative; display:flex; align-items:center; gap:10px; margin-top:6px; font-size:0.6875rem; color:var(--muted); }
  .so-row .by { font-family:var(--font-mono); opacity:.8; }
  .so-btn { background:none; border:1px solid var(--border); border-radius:var(--pill); color:var(--muted); padding:2px 10px; font-size:0.6875rem; cursor:pointer; }
  .so-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .so-btn:disabled { opacity:.45; cursor:not-allowed; }
  .so-menu { position:absolute; left:0; top:100%; margin-top:4px; z-index:20; min-width:220px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  .so-menu button { display:flex; justify-content:space-between; gap:12px; width:100%; background:none; border:0; border-radius:6px; padding:7px 10px; color:var(--text); cursor:pointer; font-size:0.75rem; text-align:left; }
  .so-menu button:hover:not(:disabled) { background:color-mix(in srgb,var(--accent) 10%,transparent); }
  .so-menu button:disabled { opacity:.5; cursor:not-allowed; }
  .net-off { opacity:.5; cursor:not-allowed !important; }
  .off-note { font-size:0.85em; font-weight:400; }
  body.ai-offline .quick-btn, body.ai-offline .send-btn:not(.stop) { opacity:.4; pointer-events:none; }
  .so-menu button span { color:var(--muted); font-family:var(--font-mono); font-size:0.6875rem; }
  .msg-stopped { align-self:center; margin:2px auto 10px; font-size:0.75rem; color:var(--muted); text-align:center; }
  .typing .stopping, .msg-bubble .stopping { font-size:0.75rem; color:var(--muted); }
  .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); gap:12px; padding:40px; text-align:center; }
  .empty-state .icon { font-size:2.875rem; opacity:.4; }
  .empty-state p { font-size:0.875rem; max-width:360px; line-height:1.6; }

  /* modal */
  .overlay { position:fixed; inset:0; background:var(--overlay); display:flex; align-items:flex-start; justify-content:center;
             padding:5vh 16px; z-index:50; overflow-y:auto; }
  .overlay[hidden] { display:none; }
  .modal { width:min(640px,100%); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px;
           box-shadow:var(--shadow); }
  .modal h2 { font-size:1.25rem; font-weight:800; margin-bottom:4px; }
  .modal .lead { color:var(--muted); font-size:0.8125rem; line-height:1.6; margin-bottom:18px; }
  .modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .x { background:none; border:0; color:var(--muted); font-size:1.375rem; cursor:pointer; line-height:1; }
  .steps { display:flex; gap:6px; margin:4px 0 18px; }
  .steps span { flex:1; height:4px; border-radius:2px; background:var(--border); }
  .steps span.on { background:var(--grad); }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:0.75rem; font-weight:600; margin-bottom:6px; }
  .field .hint { font-size:0.6875rem; color:var(--muted); margin-top:5px; line-height:1.5; }
  .field input, .field select { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px;
                                color:var(--text); font-family:var(--font-mono); font-size:0.8125rem; outline:none; }
  .field input:focus, .field select:focus { border-color:var(--accent); }
  .grid2 { display:grid; grid-template-columns:2fr 1fr; gap:12px; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; padding:9px; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg); color:var(--muted); cursor:pointer; font-size:0.75rem; }
  .seg button.on { border-color:var(--accent); color:var(--accent); background:color-mix(in srgb,var(--accent) 8%,transparent); }
  .pw-wrap { position:relative; }
  .pw-wrap input { padding-right:62px; }
  .pw-wrap button { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted);
                    font-size:0.6875rem; cursor:pointer; padding:4px 8px; }
  .result { border-radius:var(--radius); padding:12px; font-size:0.75rem; line-height:1.6; margin:4px 0 14px; }
  .result.ok { background:color-mix(in srgb,var(--ok) 8%,transparent); border:1px solid color-mix(in srgb,var(--ok) 30%,transparent); }
  .result.bad { background:color-mix(in srgb,var(--warn) 9%,transparent); border:1px solid color-mix(in srgb,var(--warn) 35%,transparent); color:color-mix(in srgb,var(--warn) 30%,var(--text)); }
  .result.warn { background:color-mix(in srgb,var(--medium) 8%,transparent); border:1px solid color-mix(in srgb,var(--medium) 35%,transparent); color:color-mix(in srgb,var(--medium) 30%,var(--text)); }
  .result code { font-family:var(--font-mono); font-size:0.6875rem; word-break:break-all; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; }
  .actions .left { margin-right:auto; }
  .conn-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .conn-row { display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); }
  .conn-row.active { border-color:color-mix(in srgb,var(--accent) 45%,transparent); }
  .conn-row .info { flex:1; min-width:0; }
  .conn-row .title { font-weight:600; font-size:0.875rem; }
  .conn-row .meta { font-family:var(--font-mono); font-size:0.6875rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

                 accept=".txt,.log,.csv,.tsv,.json,.md,.conf,.cfg,.ini,.yaml,.yml,.xml,.toml,.sh,.ps1,.bat,.py,.js,.html,.rsc,.cap,text/*,.png,.jpg,.jpeg,.gif,.webp,.bmp,.heic,.heif,.tif,.tiff,image/*">

<script>
'use strict';
const TOKEN = document.querySelector('meta[name="app-token"]').content;
const $ = id => document.getElementById(id);
let status = null;       // last /api/status
let busy = false;        // a chat request is in flight

// ── DOM helper: builds elements without innerHTML, so names from the network can't inject markup
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;            // only used with escaped markdown output
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Platform wording (Windows / macOS / Linux), as reported by the server for this computer.
const IS_MAC_UA = /Mac/.test(navigator.platform || navigator.userAgent);
const launcherName = () => (status && status.launcher) || (IS_MAC_UA ? 'start.command' : 'start.bat');
const storeName = () => (status && status.secret_store_name) || 'the system password store';
const fileStoreWarning = () => `Passwords are being saved in data/secrets.json because ${
  status && status.platform === 'mac' ? 'the macOS Keychain' : status && status.platform === 'windows' ? 'Windows Credential Manager' : 'the system password store'
} is not available. Keep that folder private.`;

// ── API ───────────────────────────────────────────────────────────────────
async function api(method, path, body, opts = {}) {
  let r;
  try {
    r = await fetch(path, { method, headers: { 'X-App-Token': TOKEN, 'Content-Type': 'application/json' },
                            body: body === undefined ? undefined : JSON.stringify(body), signal: opts.signal });
  } catch (e) {
    if (e.name === 'AbortError') throw Object.assign(new Error('Stopped.'), { kind: 'stopped' });
    throw Object.assign(new Error(`The app is not running. Start it again with ${launcherName()}.`), { kind: 'down' });
  }
  let data = {};
  try { data = await r.json(); } catch {}
  if (r.status === 401 && data.kind === 'token') {
    showBanner('The app was restarted. Reload this page to reconnect.', [h('button', { class: 'btn', onclick: () => location.reload() }, 'Reload')]);
  }
  if (!r.ok) throw Object.assign(new Error(data.error || `Request failed (${r.status})`), { kind: data.kind, status: r.status });
  return data;
}

function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, bad ? 6000 : 3000);
}
function showBanner(msg, actions) {
  $('bannerMsg').textContent = msg; $('bannerActions').replaceChildren(...(actions || [])); $('banner').hidden = false;
}
function hideBanner() { $('banner').hidden = true; }

// ── status / header ─────────────────────────────────────────────────────────
// ── Offline ────────────────────────────────────────────────────────────────
// The app re-checks the internet every minute (status.online). Offline, anything that needs it
// is greyed out and says so; it comes back by itself when the connection does. With Local AI
// the chat keeps working offline.
const OFFLINE_NOTE = 'Not available: offline';
const isOffline = () => !!(status && status.online === false);
const isCloudAI = id => id === 'anthropic' || id === 'openai';
const aiOffline = () => isOffline() && isCloudAI(status.provider);
function needsNet(el) { el.dataset.net = '1'; applyNetGate(el); return el; }
function applyNetGate(el) {
  el.querySelector(':scope > .off-note')?.remove();
  if (isOffline()) {
    if (!el.classList.contains('net-off')) {
      el.dataset.netWas = el.disabled ? '1' : '0';
      el.dataset.netTitle = el.title || '';
    }
    el.classList.add('net-off'); el.disabled = true;
    el.title = `${OFFLINE_NOTE}. This needs the internet; it comes back by itself when the connection does.`;
    el.append(h('span', { class: 'off-note' }, ` (${OFFLINE_NOTE})`));
  } else if (el.classList.contains('net-off')) {
    el.classList.remove('net-off');
    el.disabled = el.dataset.netWas === '1';
    el.title = el.dataset.netTitle || '';
  }
}
function applyNetGates() {
  document.querySelectorAll('[data-net]').forEach(applyNetGate);
  document.body.classList.toggle('ai-offline', aiOffline());
  const inp = $('chatInput');
  if (inp) inp.placeholder = aiOffline() ? `${OFFLINE_NOTE}. ${status.provider_label} needs the internet; Local AI works offline (Settings).`
                                         : 'Ask about your network…';
}
function offlineToast() { toast(`${OFFLINE_NOTE}. ${status.provider_label} needs the internet. Switch to Local AI in Settings to work offline.`, true); }

async function refreshStatus() {
  try { status = await api('GET', '/api/status'); }
  catch (e) { renderConn(null, e.message); return null; }
  renderConn(status);
  if (status.login_blocked) {
    const mins = status.retry_after ? Math.max(1, Math.ceil(status.retry_after / 60)) : 0;
    showBanner(`Sign-in to “${status.active.name}” failed, so flinchbot has stopped trying (repeated attempts make UniFi lock sign-ins). ` +
      (mins ? `It will try once more in about ${mins} min.` : 'Fix the username/password, or press Retry.'), [
      h('button', { class: 'btn', onclick: () => openConnections(status.active.id) }, 'Edit connection'),
      mins ? null : h('button', { class: 'btn', onclick: async e => {
        e.target.disabled = true; e.target.textContent = 'Signing in…';
        try { status = await api('POST', '/api/connections/retry', {}); } catch (err) { toast(err.message, true); }
        await refreshStatus(); if (status && status.connected) refreshNetwork();
      } }, 'Retry once')].filter(Boolean));
  } else if (status.error_kind === 'cert') {
    showBanner(status.error, [h('button', { class: 'btn', onclick: () => openConnections(status.active && status.active.id) }, 'Review connection')]);
  } else if (!status.configured) {
    showBanner('Set up an AI (Claude, ChatGPT or a local AI) to start chatting.', [h('button', { class: 'btn', onclick: () => openSettings() }, 'Open Settings')]);
  } else if (aiOffline()) {
    showBanner(`This computer is offline, so ${status.provider_label} can't answer. It comes back by itself when the connection does; Local AI works offline.`,
      [h('button', { class: 'btn', onclick: () => openSettings() }, 'Open Settings')]);
  } else if (status.model_warning) {
    showBanner(status.model_warning, [h('button', { class: 'btn', onclick: () => openSettings() }, 'Open Settings')]);
  } else if (status.secret_storage === 'file' && status.has_connections) {
    showBanner(fileStoreWarning(), []);
  } else hideBanner();
  applyNetGates();
  return status;
}

function renderConn(s, err) {
  const b = $('connBtn');
  if (!s) { b.className = 'conn-btn offline'; $('connName').textContent = err || 'App not running'; return; }
  if (!s.active) { b.className = 'conn-btn none'; $('connName').textContent = 'No connection — add one'; $('chatSub').textContent = ''; return; }
  b.className = 'conn-btn' + (s.connected ? '' : ' offline');
  $('connName').textContent = s.connected ? `${s.active.name} · ${s.active.host}` : `${s.active.name} · offline`;
  b.title = s.connected ? `${s.active.console_label}, site ${s.active.site}` : (s.error || '');
  $('chatSub').textContent = `${s.active.name} · site ${s.active.site}`;
  if (!s.connected && s.error && s.error_kind !== 'cert') renderSideError(s.error);
}

async function toggleConnMenu(force) {

async function activate(id) {

// ── chat ──────────────────────────────────────────────────────────────────
function formatMarkdown(text) {
  const lines = esc(text).replace(/```([\s\S]*?)```/g, (_, c) => '\u0000' + btoa(unescape(encodeURIComponent(c))) + '\u0000').split('\n');
  let out = '', list = null;
  const inline = s => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                        .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>').replace(/_\((.+?)\)_/g, '<em>($1)</em>');
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^#{1,4}\s+(.*)$/))) { close(); out += `<h3>${inline(m[1])}</h3>`; }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if (!line.trim()) { close(); out += '<br>'; }
    else { close(); out += inline(line) + '<br>'; }
  }
  close();
  return out.replace(/\u0000([^\u0000]*)\u0000/g, (_, b) => `<pre>${decodeURIComponent(escape(atob(b)))}</pre>`);
}

function clearEmpty() { const e = $('messages').querySelector('.empty-state'); if (e) e.remove(); }

// Everything shown in the chat, kept for Export (what you saw, in order).

function addMessage(role, text, opts = {}) {

  if (!opts.noRecord) transcript.push({ kind: opts.error ? 'error' : role, text: recorded, at: new Date(), ai: aiName(),
    by: opts.by || null, second: !!opts.second,

  if (files.length) bubble.append(h('div', { class: 'msg-files' }, ...files.map(f => f.image
    ? h('a', { class: 'msg-img', href: f.preview, target: '_blank', rel: 'noopener', title: `${f.name} · ${f.w}×${f.h} · click to open full size` },

function addApproval(pending) {
  clearEmpty();
  const decided = h('div', { class: 'decided' });
  const approve = h('button', { class: 'btn primary' }, pending.length > 1 ? `Approve all ${pending.length}` : 'Approve');
  const deny = h('button', { class: 'btn danger' }, 'Deny');
  const card = h('div', { class: 'msg-bubble approval' },
    h('h4', {}, pending.length > 1 ? `${aiName()} wants to make ${pending.length} changes` : `${aiName()} wants to make a change`),
    ...pending.map(p => h('div', { class: 'action' },
      h('div', { class: 'label' }, p.label),
      p.target ? h('div', { class: 'target' }, p.target) : null,
      Object.keys(p.details || {}).filter(k => k !== 'mac').length
        ? h('pre', {}, JSON.stringify(p.details, null, 2)) : null)),
    h('div', { class: 'row' }, approve, deny), decided);
  const wrap = h('div', { class: 'msg assistant' }, h('div', { class: 'msg-avatar' }, botAvatar()),
    h('div', { class: 'msg-body' }, h('div', { class: 'msg-name' }, `${BOT_NAME} · needs your approval`), card));
  const entry = { kind: 'approval', items: pending, decision: 'Waiting for approval', at: new Date() };
  transcript.push(entry);

    // One-click undo for changes the app could snapshot (Wi-Fi / LAN edits, creates, Wi-Fi deletes)
    for (const c of (d && d.changes) || []) {

      const b = h('button', { class: 'btn', style: 'margin-left:8px;padding:2px 10px', title: c.undo },

// While the AI works, Send turns into Stop (■, or Esc). Stop asks the app to drop the answer:
// it cuts off the request to the AI and the reply comes back within a second or two. If a tool
// is still running (an Nmap scan, an SSH command), the page stops waiting after 3 s anyway.
let chatAbort = null, stopTimer = null;
function setBusy(on) {
  busy = on;
  const b = $('sendBtn');
  b.disabled = false; b.classList.toggle('stop', on);
  b.textContent = on ? '■' : '➤';
  b.title = on ? 'Stop this answer (Esc)' : 'Send';
  b.setAttribute('aria-label', on ? 'Stop this answer' : 'Send');
  $('attachBtn').disabled = on;
}
async function stopChat() {
  if (!chatAbort || stopTimer) return;
  $('sendBtn').disabled = true;
  const t = $('typing')?.querySelector('.msg-bubble');
  if (t) t.replaceChildren(h('span', { class: 'stopping' }, 'Stopping…'));
  stopTimer = setTimeout(() => chatAbort?.abort(), 3000);
  try { await api('POST', '/api/chat/stop', {}); } catch {}
}
function addStopped(path, d) {
  const decide = path.endsWith('decide'), second = path.endsWith('second-opinion');
  const text = second ? 'Stopped. The second opinion was dropped.'
    : !decide ? 'Stopped. This question was dropped, so it isn\'t part of the conversation.'
    : d ? 'Stopped. The approved change ran; only the answer after it was dropped.'
        : 'Stopped. The approved change ran; only the answer after it was dropped. Undo is in 🧾 Changes.';
  if (!decide && !second) [...document.querySelectorAll('.msg.user')].pop()?.classList.add('stopped');
  transcript.push({ kind: 'note', text, at: new Date() });
  $('messages').append(h('div', { class: 'msg-stopped' }, '■ ', text)); scrollDown();
}

async function runChat(path, body) {
  setBusy(true); showTyping();
  chatAbort = new AbortController();
  let ok = false;
  try {
    const d = await api('POST', path, body, { signal: chatAbort.signal });
    $('typing')?.remove();
    if (d.stopped) addStopped(path, d);
    let el = null;
    if (d.reply && d.reply.trim()) el = addMessage('assistant', d.reply, { by: d.by, second: !!d.second_opinion });
    if (d.usage) renderUsageChip(d.usage);
    if (d.pending && d.pending.length) addApproval(d.pending);
    else if (el && !d.stopped) addAnswerFooter(el, d.by);
    if (path.endsWith('decide')) refreshNetwork();
    ok = d;
  } catch (e) {
    $('typing')?.remove();
    if (e.kind === 'stopped') { addStopped(path, null); ok = { stopped: true }; }
    else addMessage('assistant', e.message, { error: true, plain: true });
  } finally {
    clearTimeout(stopTimer); stopTimer = null; chatAbort = null;
    setBusy(false); $('chatInput').focus();
  }
  return ok;     // the response data, or false if the request failed (the error is shown in the chat)
}

// override = { text, display }: send text the app built (e.g. "Explain this alert") and show a short version
async function sendMessage(override) {
  const input = $('chatInput');
  let text = override ? override.text : input.value.trim();
  if ((!text && !attached.length) || busy) return;
  if (!status || !status.configured) { openSettings(); return; }
  if (!status.active) { openConnections(null, true); return; }
  if (aiOffline()) { offlineToast(); return; }
  const files = override ? [] : attached;
  if (!override) {
    attached = []; renderAttachments();
    if (!text) {
      const imgs = files.filter(f => f.image).length;
      text = `Please review the attached ${imgs === files.length ? 'image' : imgs ? 'attachment' : 'file'}${files.length > 1 ? 's' : ''}.`;
    }
    input.value = ''; autoResize(input);
  }
  document.querySelectorAll('.approval .row').forEach(r => { r.remove(); });  // a new message declines pending actions
  clearSecondOpinionButtons();
  transcript.forEach(t => { if (t.kind === 'approval' && t.decision === 'Waiting for approval') t.decision = 'Not approved (a new message was sent instead)'; });
  addMessage('user', override ? override.display : text, { files });
  const ok = await runChat('/api/chat', { message: text, files: files.map(f => f.image
    ? { name: f.name, image: f.image, media_type: f.media_type } : { name: f.name, text: f.text }) });
  if (!ok && files.length && !attached.length) { attached = files; renderAttachments('The message failed, so the files are still attached. Send again when ready.'); }
}

// ── Attachments: text files and images ──────────────────────────────────────
// Read in the browser and sent with the message. Nothing is uploaded to a folder or written to disk.
// Text goes to the AI inside the message; images go as pictures (PNG, JPEG, GIF, WebP are what both
// providers accept; BMP, HEIC, TIFF and other formats the browser can decode are converted to PNG/JPEG
// here). Anything with a long edge over 1568 px is scaled down to that, which is what the AI would see anyway.
const MAX_FILES = 5, MAX_FILE_CHARS = 150000, MAX_IMAGE_BYTES = 5000000, IMAGE_EDGE = 1568;
const IMAGE_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
const IMAGE_EXT = /\.(png|jpe?g|gif|webp|bmp|heic|heif|tiff?|avif|ico)$/i;
var attached = [];   // var: clearChatView may run before this line during start-up
function fmtSize(n) { return n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB` : `${(n / 1048576).toFixed(1)} MB`; }
function looksLikeImage(file) { return (file.type || '').startsWith('image/') || IMAGE_EXT.test(file.name || ''); }
function attachNote(msg) { const a = $('attachments'); a.querySelector('.att-note')?.remove(); if (msg) a.append(h('div', { class: 'att-note' }, msg)); }
function chip(f, ...extra) {
  return h('span', { class: 'att-chip' + (f.image ? ' img' : ''),
                     title: f.image ? `${f.name} · ${f.w}×${f.h}` : `${f.name} · ${f.text.length.toLocaleString()} characters` },
    f.image ? h('img', { src: f.preview, alt: '' }) : '📎 ', h('span', { class: 'n' }, f.name), h('span', { class: 'sz' }, fmtSize(f.size)), ...extra);
}
function renderAttachments(note) {
  const box = $('attachments');
  box.replaceChildren(...attached.map((f, i) => chip(f,
    h('button', { title: 'Remove', 'aria-label': `Remove ${f.name}`, onclick: () => { attached.splice(i, 1); renderAttachments(); } }, '✕'))));
  if (attached.length) attachNote(note || 'Sent to the AI exactly as is, so remove any passwords first (crop them out of screenshots). Kept only in this chat (never saved); Clear chat discards it.');
  else if (note) attachNote(note);
}
async function readImage(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw new Error(`${file.name} isn't an image this browser can read`); }
  const native = IMAGE_TYPES.includes(file.type), long = Math.max(bmp.width, bmp.height);
  let blob = file, type = file.type, w = bmp.width, hgt = bmp.height, name = file.name || 'image.png';
  if (!native || file.size > MAX_IMAGE_BYTES || long > IMAGE_EDGE) {
    const s = Math.min(1, IMAGE_EDGE / long);
    const c = document.createElement('canvas');
    c.width = w = Math.max(1, Math.round(bmp.width * s)); c.height = hgt = Math.max(1, Math.round(bmp.height * s));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    type = /jpe?g|heic|heif/i.test(file.type + ' ' + file.name) ? 'image/jpeg' : 'image/png';   // photos → JPEG, screenshots → PNG
    blob = await new Promise(r => c.toBlob(r, type, 0.9));
    if (blob && blob.size > MAX_IMAGE_BYTES && type === 'image/png') { type = 'image/jpeg'; blob = await new Promise(r => c.toBlob(r, type, 0.85)); }
    if (!blob) throw new Error(`couldn't convert ${file.name}`);
    name = name.replace(/\.[^.]+$/, '') + (type === 'image/png' ? '.png' : '.jpg');
  }
  bmp.close();
  if (blob.size > MAX_IMAGE_BYTES) throw new Error(`${file.name} is too big (${MAX_IMAGE_BYTES / 1000000} MB at most)`);
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error(`couldn't read ${file.name}`)); r.readAsDataURL(blob);
  });
  return { name, size: blob.size, image: dataUrl.slice(dataUrl.indexOf(',') + 1), media_type: type, preview: URL.createObjectURL(blob), w, h: hgt };
}
async function addFiles(list) {
  const problems = [];
  for (const file of Array.from(list || [])) {
    if (attached.length >= MAX_FILES) { problems.push(`only ${MAX_FILES} files per message`); break; }
    if (looksLikeImage(file)) {
      try { attached.push(await readImage(file)); } catch (e) { problems.push(e.message); }
      continue;
    }
    if (file.size > MAX_FILE_CHARS * 4) { problems.push(`${file.name} is too big`); continue; }
    let text;
    try { text = await file.text(); } catch { problems.push(`couldn't read ${file.name}`); continue; }
    const bad = (text.match(/\uFFFD/g) || []).length;
    if (text.includes('\0') || bad > Math.max(8, text.length / 200)) { problems.push(`${file.name} isn't a text file or an image`); continue; }
    const used = attached.reduce((n, f) => n + (f.text ? f.text.length : 0), 0);
    if (used + text.length > MAX_FILE_CHARS) { problems.push(`${file.name} would go over ${MAX_FILE_CHARS.toLocaleString()} characters for one message`); continue; }
    attached.push({ name: file.name, size: file.size, text });
  }
  renderAttachments(problems.length ? `Not attached: ${problems.join('; ')}.` : null);
  $('chatInput').focus();
}
function sendQuick(msg) { $('chatInput').value = msg; sendMessage(); }
function autoResize(el) { el.style.height = ''; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }

function clearChatView(note) {

// Model families as reported by the Models API's `line` field (never guessed from IDs).
const LINE_ORDER = ['fable', 'opus', 'sonnet', 'haiku', 'mythos'];
const LINE_HINT = { fable: 'most capable, highest cost', opus: 'very capable, higher cost',
                    sonnet: 'balanced speed, smarts and cost', haiku: 'fastest and cheapest' };
const titleCase = t => t.charAt(0).toUpperCase() + t.slice(1);

function fillModelSelect(sel, models, cur, pickNewestIfMissing) {
  const groups = {};
  for (const m of models) (groups[m.line || 'other'] = groups[m.line || 'other'] || []).push(m);
  const lines = [...LINE_ORDER.filter(l => groups[l]), ...Object.keys(groups).filter(l => !LINE_ORDER.includes(l))];
  const available = models.some(m => m.id === cur);
  if (!available && pickNewestIfMissing) {
    const pick = (groups.sonnet || []).find(m => m.lifecycle === 'active') || models.find(m => m.lifecycle === 'active');
    if (pick) cur = pick.id;
  }
  sel.replaceChildren(...lines.map(line => {
    // API order is newest first; keep that, but list active models before deprecated ones
    const list = groups[line].slice().sort((a, b) => (a.lifecycle !== 'active') - (b.lifecycle !== 'active'));
    // ★ only where the API's own `line` means 'same tier, newer version' (Claude).
    // OpenAI version groups mix tiers (Sol/Terra/Luna), so 'newest' there isn't 'best'.
    const newest = LINE_ORDER.includes(line) ? list.find(m => m.lifecycle === 'active') : null;
    return h('optgroup', { label: line === 'other' ? 'Other' : `${titleCase(line)} — ${LINE_HINT[line] || ''}`.replace(/ — $/, '') },
      ...list.map(m => h('option', { value: m.id, selected: m.id === cur },
        m.name + (m.lifecycle !== 'active' ? `  — deprecated${m.retires_at ? ', retires ' + m.retires_at : ''}`
                                         : (m === newest ? '  ★ newest' : '')))));
  }));
  if (!models.some(m => m.id === cur)) sel.prepend(h('option', { value: cur, selected: true }, `${cur} — not available to this key`));
  sel.value = cur;
  return models;
}
const PROVIDER_INFO = {
  anthropic: { short: 'Claude', by: 'by Anthropic', keyExample: 'sk-ant-api03-…',
    keyHelp: 'console.anthropic.com → API Keys',

    pricing: 'https://platform.claude.com/docs/en/about-claude/pricing' },

    modelHelp: 'GPT-6.1 Sol is a good default. GPT-6 Astra is the most capable and costs more; Terra and Luna are cheaper.',
    pricing: 'https://developers.openai.com/api/docs/pricing' },
  local: { short: 'Local AI', by: 'Ollama, LM Studio, …' },

// Usual address of each local AI server. Any OpenAI-compatible server works ("Other").
const LOCAL_PRESETS = [
  { id: 'ollama', label: 'Ollama', port: 11434 }, { id: 'lmstudio', label: 'LM Studio', port: 1234 },
  { id: 'llamacpp', label: 'llama.cpp (llama-server)', port: 8080 }, { id: 'vllm', label: 'vLLM', port: 8000 },

function localSection(info, wizard) {
  const url = h('input', { type: 'text', value: info.url || '', placeholder: 'http://office-pc:11434', spellcheck: 'false' });
  const preset = h('select', {}, ...LOCAL_PRESETS.map(p => h('option', { value: p.id }, p.label + (p.port ? ` (port ${p.port})` : ''))));
  const guess = LOCAL_PRESETS.find(p => p.port && new RegExp(`:${p.port}(/|$)`).test(info.url || ''));
  preset.value = guess ? guess.id : (info.url ? 'other' : 'ollama');
  preset.addEventListener('change', () => {
    const p = LOCAL_PRESETS.find(x => x.id === preset.value);
    if (!p || !p.port) return;
    let host = 'localhost';
    try { host = new URL(/^https?:/i.test(url.value) ? url.value : 'http://' + url.value).hostname || host; } catch {}
    url.value = `http://${host}:${p.port}`;
  });
  const key = secretInput({ placeholder: info.key_set ? `Saved (${info.key_hint}) — paste a new one, or - to remove it` : 'Optional: most local servers need no key' });
  const model = h('select', {}, info.model ? h('option', { value: info.model }, info.model) : h('option', { value: '' }, '— Test & load models first —'));
  const context = h('input', { type: 'number', min: 2048, max: 2000000, step: 1024, value: info.context || 32768 });
  const out = h('div'), found = h('div'), checkOut = h('div');
  const sec = { info, key, model, out, loaded: false };
  const fill = (models, cur) => {
    model.replaceChildren(...models.map(m => h('option', { value: m.id, selected: m.id === cur }, m.id)));
    if (!models.length) model.append(h('option', { value: '' }, '— the server has no models —'));
    else if (cur && !models.some(m => m.id === cur)) model.prepend(h('option', { value: cur, selected: true }, `${cur} — not on this server`));
    else if (!cur) model.value = models[0].id;
  };
  sec.load = async () => {
    if (!url.value.trim()) { out.replaceChildren(result('bad', 'Enter the address of the computer running the AI first.')); return false; }
    out.replaceChildren(result('warn', `Asking ${url.value.trim()} for its models…`));
    const r = await api('POST', '/api/settings/test-key', { provider: 'local', base_url: url.value.trim(), api_key: key.input.value.trim() || undefined })
      .catch(e => ({ ok: false, error: e.message }));
    if (!r.ok) { out.replaceChildren(result('bad', r.error)); return false; }
    fill(r.models, model.value);
    sec.loaded = true;
    out.replaceChildren(result('ok', `Connected. ${r.models.length} model${r.models.length === 1 ? '' : 's'} on this server.`));
    return true;
  };
  const find = async () => {
    found.replaceChildren(result('warn', 'Looking for a local AI on this computer…'));
    const r = await api('POST', '/api/settings/local-find', {}).catch(e => ({ found: [], error: e.message }));
    if (!r.found.length) { found.replaceChildren(result('warn', 'Nothing found on this computer. If the AI runs on another computer, type its address (for example http://office-pc:11434).')); return; }
    found.replaceChildren(...r.found.map(f => h('div', { class: 'result ok', style: 'display:flex;align-items:center;gap:10px' },
      h('span', { style: 'flex:1' }, `${f.server} at ${f.url} — ${f.models.length} model${f.models.length === 1 ? '' : 's'}`),
      h('button', { class: 'btn', onclick: () => {
        url.value = f.url; const p = LOCAL_PRESETS.find(x => x.port === f.port); if (p) preset.value = p.id;
        found.replaceChildren(); sec.load();
      } }, 'Use'))));
  };
  const check = async () => {
    if (!model.value) { checkOut.replaceChildren(result('bad', 'Test & load models, then pick one.')); return; }
    btnCheck.disabled = true;
    checkOut.replaceChildren(result('warn', `Checking ${model.value}… This sends a long test prompt; on a slow computer, or while the model loads, it can take a minute or two.`));
    try {
      const r = await api('POST', '/api/settings/local-probe', { base_url: url.value.trim(), api_key: key.input.value.trim() || undefined,
        model: model.value, context: Number(context.value) || 32768 });
      const t = r.tools, c = r.context || {};
      const lines = [];
      if (t.error) lines.push(result('bad', t.error));
      else if (t.ok) lines.push(result('ok', `Tools: works. Asked for a health check, the model called ${t.called.join(', ')} (${t.seconds} s).`));
      else lines.push(result('bad', `Tools: the model didn't call a tool${t.reply ? ` (it wrote: “${t.reply.slice(0, 120)}”)` : ''}. ` +
        'The app needs a model with tool support, ideally 20B parameters or larger (for example qwen3, gpt-oss, mistral-small or llama3.3).'));
      if (c.error) lines.push(result('bad', `Context: ${c.error}`));
      else if (c.ok === true) lines.push(result('ok', `Context: the server read the whole ${c.sent.toLocaleString()}-token test (${c.seconds} s).`));
      else if (c.ok === false) lines.push(result('bad', `Context: the server read only ${c.seen.toLocaleString()} of ${c.sent.toLocaleString()} tokens, so it would silently drop the start of longer conversations, which is the instructions and tool list. ` +
        `Raise its context size to ${Number(context.value).toLocaleString()} (Ollama: set OLLAMA_CONTEXT_LENGTH=${Number(context.value)} on that computer and restart Ollama; LM Studio: Context Length when loading the model), or lower the context size here to match.`));
      else if (c.sent) lines.push(result('warn', 'Context: the server doesn’t report token counts, so this couldn’t be checked.'));
      checkOut.replaceChildren(...lines);
    } catch (e) { checkOut.replaceChildren(result('bad', e.message)); }
    finally { btnCheck.disabled = false; }
  };
  const btnCheck = h('button', { class: 'btn', onclick: check }, 'Check this model');
  sec.validate = async () => {
    if (!url.value.trim()) { out.replaceChildren(result('bad', 'Enter the address of the computer running the AI first.')); return false; }
    if (!sec.loaded && !(await sec.load())) return false;
    if (!model.value) { out.replaceChildren(result('bad', 'Pick a model first.')); return false; }
    return true;
  };
  sec.payload = () => (url.value.trim() || info.url) ? { url: url.value.trim(), context: Number(context.value) || 32768 } : undefined;
  sec.el = h('div', {},
    h('div', { class: 'note' }, 'Use an AI running on your own computer or one in your office. Your network data goes only to that server. ',
      'Nothing goes to Anthropic or OpenAI unless you ask for a second opinion.'),
    field('Server', preset, 'Picks the usual port. Any server that speaks the OpenAI Chat Completions API works.'),
    field('Address', url, h('span', {}, 'The computer running the AI, and its port. On this computer use localhost. ',
      'On another computer, the AI must accept network connections: Ollama needs OLLAMA_HOST=0.0.0.0 on that computer, LM Studio has a “Serve on local network” switch. ',
      'They have no password, so allow only your own computers in the firewall.')),
    h('div', { class: 'actions', style: 'justify-content:flex-start;margin:-6px 0 12px;gap:8px' },
      h('button', { class: 'btn', onclick: sec.load }, 'Test & load models'),
      h('button', { class: 'btn', onclick: find }, '🔍 Find on this computer')),
    found, out,
    field('Key (optional)', key.wrap, 'Only if your server asks for one (hosted services, a LiteLLM proxy). Saved in the .env file on this PC.'),
    field('Model', model, 'Pick one with tool support. Small models (7–8B) often call the wrong tool; 20B or larger works much better. Changes still wait for Approve.'),
    field('Context size (tokens)', context, 'How much the server reads per request. 32,768 or more is recommended: the instructions and tools alone are about 6,000. Set the same on the server.'),
    h('div', { class: 'actions', style: 'justify-content:flex-start;margin:-6px 0 8px' }, btnCheck),
    checkOut);
  return sec;
}

async function openSettings(wizard) {
  let s;
  try { s = await api('GET', '/api/settings'); } catch (e) { toast(e.message, true); return; }
  let provider = s.provider;

  // One section per provider: key, test, live model list (Local AI: address, model, context, check)
  const sections = {};
  for (const [name, info] of Object.entries(s.providers)) {
    if (name === 'local') { sections.local = localSection(info, wizard); continue; }
    const pi = PROVIDER_INFO[name] || { short: info.label, by: '', keyHelp: '', modelHelp: '', pricing: '#' };
    const key = secretInput({ placeholder: info.key_set ? `Saved (${info.key_hint}) — paste a new key to replace` : `Paste your key (starts with ${pi.keyExample || info.key_prefix + '…'})` });
    const model = h('select', {}, h('option', { value: info.model }, info.model));
    const out = h('div'), modelNote = h('div');
    const sec = { info, key, model, out, catalogue: [], loaded: false };
    const describeChoice = () => {
      const m = sec.catalogue.find(x => x.id === model.value);
      modelNote.replaceChildren(...(m && m.lifecycle !== 'active'
        ? [result('warn', `${m.name} is deprecated${m.retires_at ? ' and stops working on ' + m.retires_at : ''}. Pick a current model.`)]
        : []));
    };
    model.addEventListener('change', describeChoice);
    sec.load = async () => {
      out.replaceChildren(result('warn', `Checking the key with ${info.vendor}…`));
      const r = await api('POST', '/api/settings/test-key', { provider: name, api_key: key.input.value.trim() || undefined })
        .catch(e => ({ ok: false, error: e.message }));
      if (!r.ok) { out.replaceChildren(result('bad', r.error)); return false; }
      sec.catalogue = fillModelSelect(model, r.models, model.value, wizard);
      sec.loaded = true;
      describeChoice();
      out.replaceChildren(result('ok', `Key works. ${r.models.filter(m => m.lifecycle === 'active').length} current models available.`));
      return true;
    };
    sec.el = h('div', {},
      field(`${info.vendor} API key`, key.wrap, h('span', {}, `Create one at ${pi.keyHelp}. Saved only in the .env file on this PC.`)),
      h('div', { class: 'actions', style: 'justify-content:flex-start;margin:-6px 0 12px' }, needsNet(h('button', { class: 'btn', onclick: sec.load }, 'Test key & load models'))),
      out,
      field(`${pi.short} model`, model, h('span', {}, 'The list comes live from ' + info.vendor + ', so new models appear automatically. ' + pi.modelHelp + ' Prices: ',
        h('a', { href: pi.pricing, target: '_blank', rel: 'noopener', style: 'color:var(--accent)' }, `${info.vendor} pricing`), '.')),
      modelNote);
    sections[name] = sec;
  }

  const holder = h('div');
  const segBtns = {};
  const choose = name => {
    provider = name;
    Object.entries(segBtns).forEach(([n, b]) => b.className = n === name ? 'on' : '');
    holder.replaceChildren(sections[name].el);
    const i = sections[name].info;
    if ((i.key_set || i.url) && !sections[name].loaded && !(isOffline() && isCloudAI(name))) sections[name].load();   // live list without an extra click
  };
  for (const [name, info] of Object.entries(s.providers)) {
    const pi = PROVIDER_INFO[name] || { short: info.label, by: '' };
    segBtns[name] = h('button', { type: 'button', onclick: () => choose(name) },
      h('div', { style: 'font-weight:600' }, pi.short), h('div', { style: 'font-size:10px;opacity:.7' }, pi.by));
  }
  const port = h('input', { type: 'number', min: 1024, max: 65535, value: s.port });

  const save = async (next) => {
    const sec = sections[provider];
    try {
      if (sec.validate) { if (!(await sec.validate())) return; }
      else {
        if (!sec.key.input.value.trim() && !sec.info.key_set) { sec.out.replaceChildren(result('bad', `Paste your ${sec.info.vendor} API key first.`)); return; }
        if (sec.key.input.value.trim() && !(await sec.load())) return;
      }
      const keys = {}, models = {};
      for (const [name, x] of Object.entries(sections)) {
        if (x.key.input.value.trim()) keys[name] = x.key.input.value.trim();
        if ((x.loaded || name === provider) && x.model.value) models[name] = x.model.value;
      }
      const local = sections.local && sections.local.payload ? sections.local.payload() : undefined;
      const r = await api('POST', '/api/settings', { provider, keys, models, local,
        port: (wizard || Number(port.value) === s.port) ? undefined : port.value });
      const short = PROVIDER_INFO[provider] ? PROVIDER_INFO[provider].short : provider;
      if (r.restart_needed) toast(`Saved. The new port (${r.port}) takes effect after you restart the app.`);
      else toast(r.switched ? `Switched to ${short}. The conversation carries on.` : 'Settings saved.');
      await refreshStatus();
      if (next) next(); else closeModal();
    } catch (e) { sec.out.replaceChildren(result('bad', e.message)); }
  };
  const overrides = s.env_overrides.length
    ? h('div', { class: 'note warn' }, `These are set as environment variables on this computer and override this screen: ${s.env_overrides.join(', ')}. Remove them ${
        status && status.platform === 'windows' ? '(System Properties → Environment Variables) ' : '(from your shell profile or launch settings) '}if you want this screen to control them.`) : null;

  const body = [
    overrides,
    field('AI provider', h('div', { class: 'seg' }, ...Object.values(segBtns)),
      'Pick whose AI answers. You can set up all three and switch any time; the conversation carries on. ' +
      'Under each answer, Second opinion asks one of the others to check it.'),
    holder,
    wizard ? null : field('App port', port, `This app's web address is http://127.0.0.1:${s.running_port}/. Change only if another program uses this port.`),
  ];
  if (wizard) {
    openModal(...modalHead('Welcome! Let’s get you set up', 'Two quick steps: connect an AI (Claude, ChatGPT or your own local AI), then connect your UniFi console. Your settings stay on this PC.', false),
      h('div', { class: 'steps' }, h('span', { class: 'on' }), h('span')),
      h('h3', { style: 'font-size:15px;margin-bottom:12px' }, 'Step 1 · Choose your AI'),
      ...body, h('div', { class: 'actions' }, h('button', { class: 'btn primary', onclick: () => save(() => openConnections(null, true, true)) }, 'Save & continue →')));
  } else {
    openModal(...modalHead('Settings', `Saved to ${s.env_path}`), ...body,
      h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: closeModal }, 'Cancel'), h('button', { class: 'btn primary', onclick: () => save() }, 'Save')));
  }
  choose(provider);
}
